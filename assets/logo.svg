<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 220"
     width="700"
     height="220">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>
  </defs>

  <!-- Safari / Sun Symbol -->
  <circle
    cx="105"
    cy="82"
    r="42"
    fill="none"
    stroke="url(#gold)"
    stroke-width="6"
  />

  <!-- Mountain -->
  <path
    d="M35 145 L82 82 L105 112 L132 70 L180 145"
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sun rays -->
  <g
    stroke="url(#gold)"
    stroke-width="5"
    stroke-linecap="round"
  >
    <line x1="105" y1="22" x2="105" y2="8"/>
    <line x1="105" y1="156" x2="105" y2="170"/>
    <line x1="45" y1="82" x2="30" y2="82"/>
    <line x1="165" y1="82" x2="180" y2="82"/>
  </g>

  <!-- Brand -->
  <text
    x="210"
    y="105"
    fill="url(#gold)"
    font-family="Georgia, serif"
    font-size="62"
    font-weight="bold"
    letter-spacing="8">
    QUELUXY
  </text>

  <text
    x="214"
    y="145"
    fill="#D4AF37"
    font-family="Arial, sans-serif"
    font-size="19"
    font-weight="600"
    letter-spacing="11">
    TOURS
  </text>

  <!-- Tagline -->
  <text
    x="214"
    y="177"
    fill="#999999"
    font-family="Arial, sans-serif"
    font-size="11"
    letter-spacing="3">
    SAFARI ZA KIPEKEE
  </text>

</svg>
